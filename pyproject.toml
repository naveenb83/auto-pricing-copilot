[project]
name = "auto-pricing-copilot"
version = "0.1.0"
description = "Aged-inventory pricing copilot on Databricks (FE Bar build)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.1,<2.3",
  "scikit-learn==1.5.2",
  "mlflow>=2.17,<3.5",
  "requests>=2.31",
  "pillow>=10",
  "databricks-sdk>=0.166.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
